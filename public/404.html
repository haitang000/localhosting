<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>页面不存在 · localhosting</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='5' width='22' height='22' rx='7' fill='none' stroke='%23006FEE' stroke-width='3'/></svg>"
    />
  </head>
  <body>
    <main class="nf-page">
      <div class="nf">
        <!-- The same rounded square as the favicon and the boot loader — this

          <rect x="5" y="5" width="22" height="22" rx="7" />
        </svg>
        <p class="nf-code">404</p>
        <h1>页面不存在</h1>
        <p class="sub">这个地址在面板上不存在 —— 可能拼错了，也可能已经被移走。</p>
        <a class="btn" href="/">返回面板</a>
      </div>
